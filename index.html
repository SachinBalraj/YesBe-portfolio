<!doctype html>
  <html lang="en" class="scroll-smooth overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light" />

    <!-- Primary SEO -->
    <title>IT Consulting &amp; Software Development Company | YESBE Technologies</title>
    <meta name="description" content="YESBE Technologies is an IT consulting and software development company. Web development, custom software, ERP, AI, automation and digital transformation." />
    <meta name="author" content="YESBE Technologies" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.yesbe.tech" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.yesbe.tech" />
    <meta property="og:title" content="IT Consulting &amp; Software Development Company | YESBE Technologies" />
    <meta property="og:description" content="YESBE Technologies is an IT consulting and software development company. Web development, custom software, ERP, AI, automation and digital transformation." />
    <meta property="og:image" content="https://www.yesbe.tech/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="YESBE Technologies — IT consulting and software development" />
    <meta property="og:site_name" content="YESBE Technologies" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.yesbe.tech" />
    <meta name="twitter:title" content="IT Consulting &amp; Software Development Company | YESBE Technologies" />
    <meta name="twitter:description" content="YESBE Technologies is an IT consulting and software development company. Web development, custom software, ERP, AI, automation and digital transformation." />
    <meta name="twitter:image" content="https://www.yesbe.tech/og-image.png" />
    <meta name="twitter:image:alt" content="YESBE Technologies — IT consulting and software development" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#2563EB" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!--
      Analytics is not loaded here. Google Tag Manager is injected at runtime by
      src/utils/analytics.ts, and only after the visitor grants analytics
      consent. Loading GTM (or a second gtag.js) in the document head both
      bypassed consent and duplicated every tag.
    -->

    <!-- Hero LCP image: start the request before the JS bundle is parsed. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero/hero-poster.webp"
      type="image/webp"
      fetchpriority="high"
      data-home-preload
    />

    <!-- Self-hosted Inter latin faces: preload only the weights used above the fold. -->
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preconnect critical origins -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Inline critical CSS for fast initial paint -->
    <style>
      *,*::before,*::after{box-sizing:border-box;border:0 solid}
      html{scroll-behavior:smooth;overflow-x:hidden;-webkit-text-size-adjust:100%}
      body{min-height:100vh;margin:0;background:#fff;color:#0f172a;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-feature-settings:"rlig" 1,"calt" 1;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
      #root{min-height:100vh}
      #app-loader{z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
    </style>
  </head>
  <body class="min-h-screen bg-background antialiased">
    <div id="root">
      <!-- Fast initial loading indicator while JS loads -->
      <div id="app-loader" style="position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff">
        <div style="width:48px;height:48px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Schema.org JSON-LD — Organization & WebSite (injected via BusinessSchema component) -->


  </body>
</html>
